[build]
  base = "ts-reader"
  command = "node --check netlify/functions/ts-job-background.mjs && node --check netlify/functions/ts-result.mjs && node --check netlify/functions/ts-login.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."ts-job-background"]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]
